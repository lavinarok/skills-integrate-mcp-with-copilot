<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
          Dark mode
        </button>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div class="activity-controls" aria-label="Filter and sort activities">
          <label>
            Search
            <input type="search" id="search" placeholder="Search activities" />
          </label>
          <label>
            Category
            <select id="category">
              <option value="all">All categories</option>
            </select>
          </label>
          <label>
            Sort by
            <select id="sort">
              <option value="name">Name</option>
              <option value="schedule">Schedule</option>
            </select>
          </label>
        </div>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>
    </main>

    <dialog id="registration-dialog" aria-labelledby="registration-title">
      <form method="dialog" id="signup-form" class="registration-form">
        <button type="button" id="close-dialog" class="dialog-close" aria-label="Close registration dialog">&times;</button>
        <p class="eyebrow">Register a student</p>
        <h2 id="registration-title">Sign up for an activity</h2>
        <p id="selected-activity" class="selected-activity"></p>
        <label for="email">Student email</label>
        <input type="email" id="email" required placeholder="your-email@mergington.edu" />
        <div class="dialog-actions">
          <button type="button" id="cancel-registration" class="secondary-button">Cancel</button>
          <button type="submit">Sign up</button>
        </div>
        <div id="message" class="hidden" role="status"></div>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
